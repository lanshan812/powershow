[package]
name = "powershow"
version = "2.0.0"
description = "PowerShow - floating battery card for Bluetooth peripherals"
edition = "2021"
authors = ["lanshan812"]

[lib]
name = "powershow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
