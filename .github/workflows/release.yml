name: Release

on:
  push:
    tags:
      - 'v2*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf build-essential

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PowerShow ${{ github.ref_name }}'
          releaseBody: |
            ## 下载

            | 平台 | 文件 | 使用方式 |
            |---|---|---|
            | Windows | `PowerShow_x.x.x_x64-setup.exe` | 直接安装 |
            | Windows（免安装） | `PowerShow_x.x.x_x64-portable.zip` | 解压后双击 `PowerShow.exe` |
            | Linux | `powershow_x.x.x_amd64.deb` | `sudo dpkg -i` 安装（需系统自带 webkit2gtk） |
            | Linux | `PowerShow_x.x.x_amd64.AppImage` | `chmod +x` 后直接运行 |
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package portable exe (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          7z a "PowerShow-${{ github.ref_name }}-portable.zip" ./src-tauri/target/release/PowerShow.exe

      - name: Upload portable zip (Windows)
        if: matrix.platform == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} "PowerShow-${{ github.ref_name }}-portable.zip" --clobber